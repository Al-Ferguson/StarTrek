[project]
name = "StarTrek"
keywords = ["Star Trek", "Fleet Command", "Python"]
version = "0.2.6"
requires-python = ">=3.14"
description = "Star Trek Fleet Command Projects"
authors = [
    {name = "Al Ferguson", email = "aferguson@neptunescove.org"},
]
maintainers = [
    {name = "Al Ferguson", email = "aferguson@neptunescove.org"},
]
license = "GPL-3.0-or-later"
readme = "README.md"
classifiers  = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable    
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx2[http2]>=2.16.0",
]

[project.urls]
url = "https://github.com/AlFerguson/StarTrek_Projects"
documentation = "https://docs.github.com/AlFerguson/StarTrek_Projects"

[tool.uv]
upgrade = true

[tool.mypy]
allow_redefinition = false
check_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
local_partial_types = true
no_implicit_optional = true
python_version = "3.14"
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "mypy>=1.7.1",
    "pyrefly>=1.4.0",
    "ruff>=0.15.17.0",
    "semgrep>=1.167.0.0",
    "annotated-types>=0.8.0",
    "mypy-extensions>=1.1.0",
    "typing_extensions>=4.16.0",
]
